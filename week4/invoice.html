<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice</title>
  </head>
  <body>
    <header>
      <h1>Tech Store</h1>
    </header>
    <main>
      <h2>Invoice</h2>
      <table border="1" cellspacing="0" cellpadding="5">
        <tr>
          <th>ល.រ</th>
          <th>ឈ្មោះទំនិញ</th>
          <th>ចំនួន</th>
          <th>តម្លៃរាយ</th>
          <th>តម្លៃសរុប</th>
        </tr>
        <tr>
          <th>No</th>
          <th>Product Name</th>
          <th>Quantity</th>
          <th>Unit Price</th>
          <th>Total Price</th>
        </tr>
        <tr>
          <td>1</td>
          <td>Asus Computer</td>
          <td>5</td>
          <td>$500</td>
          <td>$2500</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Iphone 18</td>
          <td>10</td>
          <td>$1200</td>
          <td>$12000</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Samsung TV</td>
          <td>3</td>
          <td>$800</td>
          <td>$2400</td>
        </tr>
        <tr>
          <td colspan="3" rowspan="2"></td>
          <td>សរុប</td>
          <td rowspan="2">$16900</td>
        </tr>
        <tr>
          <td>Total</td>
        </tr>
      </table>
    </main>
    <footer>
      <p>&copy; Tech Store 2026</p>
    </footer>
  </body>
</html>
